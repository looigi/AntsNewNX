<div *ngIf="mascheraModificaAttivaComboAgentProfileN" class="oscura"></div>
<div *ngIf="mascheraModificaAttivaComboAgentProfileN" class="mascheraModifica2 drag-boundary resizable" #myBounds1 ngDraggable [handle]="handleMenu1"
  [ngClass]="{ 'top-b': !edge?.top, 'bottom-b': !edge?.bottom, 'left-b': !edge?.left, 'right-b': !edge?.right }"
  (edge)="checkEdge($event)" [bounds]="divContenitore" [inBounds]="true">
  <div class="bottoniIntestazione" style="background-color: #565656;">
    <div #handleMenu1 class="drag-block" style="width: 80%; float: left; text-align: left; color: white;">
      {{TitoloMascheraModificaCombo5N}}
    </div>
    <div style="width: 20%; float: left; text-align: right; margin-top: -4px;">
      <img *ngIf="Utils.linkIcone && Utils.linkIcone.toUpperCase().indexOf('UNDEFINED')==-1" [src]="Utils.linkIcone + '/icons/check-circle_white.png'" (click)="chiudeMascheraComboAgentProfileN($event)" title="Confirm the operation" class="immagini">
      <img *ngIf="Utils.linkIcone && Utils.linkIcone.toUpperCase().indexOf('UNDEFINED')==-1" [src]="Utils.linkIcone + '/icons/close_context.png'" (click)="mascheraModificaAttivaComboAgentProfileN = false" title="Close" class="immagini">
    </div>
  </div>
  <div class="modificaDati">
    <div *ngIf="rigaSelezionata" style="width: 100%;">
      <div style="width: 20%; float: left;">Value</div>
      <div style="width: 80%; float: left;">
        <app-combo-component
          *ngIf="rigaSelPerModificaN.DOMAIN_TYPE === 'LOV'"
          [Tipologia]="'DropDown'"
          [userName]="userName"
          [data]="datiLov"
          [campoId]="'ID'"
          [campoTesto]="'NAME'"
          [campoFiltro]="'NAME'"
          [NomeCombo]="'cmbDatiLovTC'"
          [pulisceValoriDiBase]="true"
          [ricordaUltimoValore]='false'
          [valoreDefault]="lovSelezionato"

          (selezioneEffettuata)="selectLov($event)"
        >
        </app-combo-component>

        <app-combo-component
          *ngIf="rigaSelPerModificaN.DOMAIN_TYPE === 'string' && rigaSelPerModificaN.DOMAIN_LOV.length > 0"
          [Tipologia]="'Combo'"
          [userName]="userName"
          [data]="datiLov"
          [campoId]="'ID'"
          [campoTesto]="'NAME'"
          [campoFiltro]="'NAME'"
          [NomeCombo]="'cmbDatiLovTCString'"            
          [accettaNuovi]="true"
          [pulisceValoriDiBase]="true"
          [ricordaUltimoValore]='false'
          [valoreDefault]="lovSelezionato"

          (selezioneEffettuata)="selectLovString($event)"
        >
        </app-combo-component>

        <app-calendario
          *ngIf="rigaSelPerModificaN.DOMAIN_TYPE === 'date'"
          [Utils]="Utils"
          [dataPassata]="rigaSelPerModificaN.VALUE"
          [formatoPopup]="'DATA'"
          [formato]="'yyyy-MM-dd'"
          [chiusuraAutomatica]="true"

          (dataSelezionata)="lovSelezionato = $event"
        >
        </app-calendario>

        <input *ngIf="rigaSelPerModificaN.DOMAIN_TYPE === 'integer' || rigaSelPerModificaN.DOMAIN_TYPE === 'decimal'" (keyup.enter)="chiudeMascheraComboAgentProfileN($event)" type="number" style="width: 100%;" [(ngModel)]="lovSelezionato">
        <input *ngIf="rigaSelPerModificaN.DOMAIN_TYPE === 'string' && !rigaSelPerModificaN.DOMAIN_LOV" (keyup.enter)="chiudeMascheraComboAgentProfileN($event)" type="text" style="width: 100%;" [(ngModel)]="lovSelezionato">
        <input *ngIf="rigaSelPerModificaN.DOMAIN_TYPE === 'not_editable'" type="text" style="width: 100%;" disabled="true" value="{{lovSelezionato}}">
      </div>
    </div>
  </div>
</div>

<div *ngIf="mascheraModificaAttiva1" class="oscura"></div>
<div *ngIf="mascheraModificaAttiva1" class="mascheraModifica2 drag-boundary resizable" #myBounds1 ngDraggable [handle]="handleMenu2"
  [ngClass]="{ 'top-b': !edge?.top, 'bottom-b': !edge?.bottom, 'left-b': !edge?.left, 'right-b': !edge?.right }"
  (edge)="checkEdge($event)" [bounds]="divContenitore" [inBounds]="true">
  <div class="bottoniIntestazione" style="background-color: #565656;">
    <div #handleMenu2 class="drag-block" style="width: calc(100% - 100px); float: left; text-align: left; color: white;">
      {{titoloMaschera}}
    </div>
    <div style="width: 100px; float: left; text-align: right; margin-top: -4px;">
      <img kendoTooltip *ngIf="Utils.linkIcone" [src]="Utils.linkIcone + '/icons/check-circle_white.png'" class="immagini" title="Save" (click)="salvaDati1()">
      <img *ngIf="Utils.linkIcone && Utils.linkIcone.toUpperCase().indexOf('UNDEFINED')==-1" [src]="Utils.linkIcone + '/icons/close_context.png'" (click)="chiudeMaschera1()" title="Close" class="immagini">
    </div>
  </div>

  <div style="width: 100%; height: 30px;">
    <div style="width: 20%; float: left; ">
      Name
    </div>
    <div style="width: 80%; float: left; text-align: center;">
      <input type="text" style="width: 100%;" [(ngModel)]="tsName" />
    </div>
  </div>
  <div style="clear: both;"></div>

  <div style="width: 100%; height: 30px;">
    <div style="width: 20%; float: left; ">
      Folder
    </div>
    <div style="width: 80%; float: left; text-align: center;">
      <!-- <input type="text" style="width: 100%;" [(ngModel)]="tsFolder" /> -->
      <app-combo-component
        *ngIf = "datiGriglia"
        [Tipologia]="'Combo'"
        [userName]="userName"
        [data]="datiGriglia.DataTable"
        [campoId]="'VALUE_STR'"
        [campoTesto]="'VALUE_STR'"
        [campoFiltro]="'VALUE_STR'"
        [NomeCombo]="'cmbdatiFoldersFleet'"
        [pulisceValoriDiBase]="true"
        [ricordaUltimoValore]='false'
        [valoreDefault]="tsFolder"
        [pulisceFiltro]="pulisceFiltroFolders"
        [accettaNuovi]="true"

        (selezioneEffettuata)="selectFolders($event)"
      >
      </app-combo-component>

    </div>
  </div>
  <div style="clear: both;"></div>

  <div style="width: 100%; height: 30px;">
    <div style="width: 20%; float: left; ">
      Operator Group
    </div>
    <div style="width: 80%; float: left; text-align: center;">
      <!-- <input type="text" style="width: 100%;" [(ngModel)]="tsFolder" /> -->
      <app-combo-component
        *ngIf = "datiOperatorGroup"
        [Tipologia]="'DropDown'"
        [userName]="userName"
        [data]="datiOperatorGroup.DataTable"
        [campoId]="'NAME'"
        [campoTesto]="'NAME'"
        [NomeCombo]="'cmbdatiOperatorGroupFleet'"
        [pulisceValoriDiBase]="true"
        [ricordaUltimoValore]='false'
        [valoreDefault]="tsOperatorGroup"
        [pulisceFiltro]="pulisceFiltroFolders"
        [accettaNuovi]="false"

        (selezioneEffettuata)="selectOperatorGroup($event)"
      >
      </app-combo-component>

    </div>
  </div>
  <div style="clear: both;"></div>

  <div style="width: 100%; height: 30px;">
    <div style="width: 20%; float: left; ">
      Description
    </div>
    <div style="width: 80%; float: left; text-align: center;">
      <input type="text" style="width: 100%;" [(ngModel)]="tsDescription" />
    </div>
  </div>
  <div style="clear: both;"></div>
</div>
