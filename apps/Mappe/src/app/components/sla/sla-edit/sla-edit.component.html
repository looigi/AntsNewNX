<div *ngIf="mascheraVisibile" class="bloccaSfondo" style="z-index: 5005;"></div>

<div #myBounds *ngIf="mascheraVisibile" class="drag-boundary" style="position: absolute; left: 1px; top: 1px; width: 100%; height: 100%;"
  [ngClass]="{ 'top-b': !edge?.top, 'bottom-b': !edge?.bottom, 'left-b': !edge?.left, 'right-b': !edge?.right }"
>
  <div *ngIf="mascheraVisibile" ngDraggable [handle]="handleInfo" class="mascheraPrincipale drag-block"
    (edge)="checkEdge($event)" [bounds]="myBounds" [inBounds]="true"
    (visibileEmit)="mascheraVisibile = false;" class="resizable">
    <div kendoTooltip class="drag-block-handle barraSuperiore" style="position: absolute; text-align: left; white-space: nowrap; height: 28px;">
      <div #handleInfo style="text-align: center; width: 80%; float: left; margin-top: 2px;">SLA Edit</div>

      <!-- <div style="float: right;">
        <img kendoTooltip *ngIf="Utils.linkIcone && Utils.linkIcone.toUpperCase().indexOf('UNDEFINED')==1" [src]="Utils.linkIcone + '/icons/check-circle_white.png'" class="immagini" style="width: 25px; height: 25px; float: left;"
        title="Save" (click)="salvaDati()">
        <img *ngIf="Utils.linkIcone && Utils.linkIcone.toUpperCase().indexOf('UNDEFINED')==1" [src]="Utils.linkIcone + '/icons/close_context.png'" (click)="mostraNascondeMenu()" title="Close"
        class="immaginiChiusura">
      </div > -->

      <div style="float: right;">
        <img kendoTooltip [src]="Utils.linkIcone + '/icons/check-circle_white.png'" class="immagini" style="margin-top: 1px; width: 25px; height: 25px; float: left;" title="Save" (click)="salvaDati()">
        <img *ngIf="Utils.linkIcone" [src]="Utils.linkIcone + '/icons/close_context.png'" (click)="mostraNascondeMenu()" title="Close"
        class="immaginiChiusura">
      </div>
    </div>

    <div style="margin-top: 30px; padding: 5px;">
        <div class="titolo">
          <span class="testo scuro">SLA Name:</span>
        </div>
        <div class="contenuto">
          <input class="casellaTesto"
            style="border: 1px solid #ebebeb; text-align: left;"
            type = "text"
            [(ngModel)]="name"
            value="{{name}}" />
        </div>
        <div style="clear: both;"></div>

        <div class="titolo">
          <span class="testo scuro">Description: </span>
        </div>
        <div class="contenuto">
          <textarea
            style="width: 100%; border: 1px solid #ebebeb; color: #656565;"
            [(ngModel)]="description"
            value="{{description}}" >
          </textarea>
        </div>
        <div style="clear: both;"></div>

        <div class="titolo" style="margin-top: 14px !important;">
          <span class="testo scuro">Folder: </span>
        </div>
        <div class="contenuto">
          <app-combo-component
            [Tipologia]="'Combo'"
            [data] = "slaGroup2"
            [userName]="userName"
            [NomeCombo]="'SlaFolder'"
            [campoId]="'VALUE_STR'"
            [campoTesto]="'VALUE_STR'"
            [campoFiltro]="'VALUE_STR'"
            [valoreDefault]="folder"
            [accettaNuovi]="true"
            [ricordaUltimoValore]="false"
            [pulisceFiltro]="pulisceFiltroSLA"

            (selezioneEffettuata)="selectFolder($event)"
          >
          </app-combo-component>
        </div>
        <div style="clear: both;"></div>
    </div>
  </div>
</div>
