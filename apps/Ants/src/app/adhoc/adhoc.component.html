<as-split direction="horizontal" [gutterSize]="3">
    <as-split-area [size]="25">
        <!-- 
            [iconaFolderGroupVisibile]="true"
        -->
        <app-ants-grid-lib
            *ngIf="datiGrigliaTree"
            [sessioneAttuale]="sessioneID"
            [righePerPaginareAutomaticamente]="righePerPaginareAutomaticamente"
            [indirizzoServer]="Utils.serverPostRest"
            [modalita]="'Griglia'"
            [title]="nomeGrigliaTree"
            [titleDaDatiGriglia]="true"
            [data]="datiGrigliaTree"
            [userName]="userName"
            [maskName]="userName + '_grigliaAHTree'"
            [eseguiAutoFitAutomatico]="true"
            
            [raggruppabile]="true"
            [campiPerRaggruppamento]="'folder'"
            [collassaTutto]="true"
            [visualizzaScrittaFolder]="false"
            (groupClickEmit)="groupClickEmit($event)"

            [newKeyVisibile]='false'
            [refreshKeyVisibile]='true'
            [editKeyVisibile]='false'
            [deleteKeyVisibile]='false'
            [infoKeyVisibile]='true'
            [confirmKeyVisibile]="false"
            [selezioneMultipla]='false'
            [impostaSelezione]="selezioneTree"
            [AutoResize]="true"
            [righeAutomatiche]="false"
            [datiNuovi]="datiGrigliaTree && datiGrigliaTree.DataTable"
            [messaggioWarning]="messaggioWarningTree"
            [linkIcone]="Utils.linkIcone"

            [paginazione]="'scrollable'"
            [pageSize]="Utils.limitPerVirtual"
            [DimensioneFont]='12'

            (cellClick)="clickSelezioneTree($event)"
            (lastSelectedOfGrid)='lastSelectedOfGridTree($event)'
            (refresh)='refreshGridTree($event, false)'
            (resetLayout)='refreshGridTree($event, true)'
            (detectCambioPagina)="cambioPaginaTree($event)"
            (ritornoDimensioniColonne)="ritornoDimensioniColonneGrigliaTree($event)"
        >
        </app-ants-grid-lib>

        <div *ngIf="caricamentoDatiInCorsoTree == true" class="k-icon k-i-loading"
            style="position: sticky; left: 0px; top: 0px; width: 100%; height: 100%; z-index: 2000;"
        ></div>
    </as-split-area>
    <as-split-area [size]="75">
        <as-split direction="vertical" [gutterSize]="3">
            <as-split-area [size]="50">
                <div style="width: 100%; height: 100%">
                    <app-ants-grid-lib
                        *ngIf="datiGrigliaGriglia"
                        [sessioneAttuale]="sessioneID"
                        [righePerPaginareAutomaticamente]="righePerPaginareAutomaticamente"
                        [indirizzoServer]="Utils.serverPostRest"
                        [modalita]="'Griglia'"
                        [title]="nomeGrigliaGriglia"
                        [titleDaDatiGriglia]="true"
                        [data]="datiGrigliaGriglia"
                        [userName]="userName"
                        [maskName]="userName + '_grigliaAHGriglia'"
                        [newKeyVisibile]='false'
                        [refreshKeyVisibile]='true'
                        [editKeyVisibile]='true'
                        [deleteKeyVisibile]='false'
                        [infoKeyVisibile]='true'
                        [confirmKeyVisibile]="false"
                        [selezioneMultipla]='false'
                        [impostaSelezione]="selezioneGriglia"
                        [AutoResize]="true"
                        [righeAutomatiche]="false"
                        [datiNuovi]="datiGrigliaGriglia && datiGrigliaGriglia.DataTable"
                        [messaggioWarning]="messaggioWarningGriglia"
                        [linkIcone]="Utils.linkIcone"

                        [paginazione]="'scrollable'"
                        [pageSize]="Utils.limitPerVirtual"
                        [DimensioneFont]='12'

                        (cellClick)="clickSelezioneGriglia($event)"
                        (lastSelectedOfGrid)='lastSelectedOfGridGriglia($event)'
                        (refresh)='refreshGridGriglia($event, false)'
                        (editKeyPressed)="editPremuto($event)"
                        (resetLayout)='refreshGridGriglia($event, true)'
                        (detectCambioPagina)="cambioPaginaGriglia($event)"
                        (ritornoDimensioniColonne)="ritornoDimensioniColonneGrigliaGriglia($event)"
                    >
                    </app-ants-grid-lib>

                    <div *ngIf="caricamentoDatiInCorsoGriglia == true" class="k-icon k-i-loading"
                        style="position: sticky; left: 0px; top: 0px; width: 100%; height: 100%; z-index: 2000;"
                    ></div>
                </div>
            </as-split-area>
            <as-split-area [size]="50">
                <as-split direction="horizontal" [gutterSize]="3">
                    <as-split-area [size]="30">
                        <div style="width: 100%; height: 100%">
                            <app-ants-grid-lib
                                *ngIf="datiGrigliaGriglia1"
                                [sessioneAttuale]="sessioneID"
                                [righePerPaginareAutomaticamente]="righePerPaginareAutomaticamente"
                                [indirizzoServer]="Utils.serverPostRest"
                                [modalita]="'Griglia'"
                                [title]="nomeGrigliaGriglia1"
                                [titleDaDatiGriglia]="true"
                                [data]="datiGrigliaGriglia1"
                                [userName]="userName"
                                [maskName]="userName + '_grigliaAHGriglia1'"
                                [newKeyVisibile]='false'
                                [refreshKeyVisibile]='true'
                                [editKeyVisibile]='true'
                                [deleteKeyVisibile]='false'
                                [infoKeyVisibile]='true'
                                [confirmKeyVisibile]="false"
                                [selezioneMultipla]='false'
                                [impostaSelezione]="selezioneGriglia1"
                                [AutoResize]="true"
                                [righeAutomatiche]="false"
                                [datiNuovi]="datiGrigliaGriglia1 && datiGrigliaGriglia1.DataTable"
                                [messaggioWarning]="messaggioWarningGriglia1"
                                [linkIcone]="Utils.linkIcone"

                                [paginazione]="'scrollable'"
                                [pageSize]="Utils.limitPerVirtual"
                                [DimensioneFont]='12'

                                (cellClick)="clickSelezioneGriglia1($event)"
                                (lastSelectedOfGrid)='lastSelectedOfGridGriglia1($event)'
                                (refresh)='refreshGridGriglia1($event, false)'
                                (editKeyPressed)="editPremuto($event)"
                                (resetLayout)='refreshGridGriglia1($event, true)'
                                (detectCambioPagina)="cambioPaginaGriglia1($event)"
                                (ritornoDimensioniColonne)="ritornoDimensioniColonneGrigliaGriglia($event)"
                            >
                            </app-ants-grid-lib>

                            <div *ngIf="caricamentoDatiInCorsoGriglia1 == true" class="k-icon k-i-loading"
                                style="position: sticky; left: 0px; top: 0px; width: 100%; height: 100%; z-index: 2000;"
                            ></div>
                        </div>
                    </as-split-area>
                    <as-split-area [size]="70">
                        <div style="width: 100%; height: 100%">
                            <app-ants-grid-lib
                                *ngIf="datiGrigliaGriglia2"
                                [sessioneAttuale]="sessioneID"
                                [righePerPaginareAutomaticamente]="righePerPaginareAutomaticamente"
                                [indirizzoServer]="Utils.serverPostRest"
                                [modalita]="'Griglia'"
                                [title]="nomeGrigliaGriglia2"
                                [titleDaDatiGriglia]="true"
                                [data]="datiGrigliaGriglia2"
                                [userName]="userName"
                                [maskName]="userName + '_grigliaAHGriglia2'"
                                [newKeyVisibile]='false'
                                [refreshKeyVisibile]='true'
                                [editKeyVisibile]='true'
                                [deleteKeyVisibile]='false'
                                [infoKeyVisibile]='true'
                                [confirmKeyVisibile]="false"
                                [selezioneMultipla]='false'
                                [impostaSelezione]="selezioneGriglia2"
                                [AutoResize]="true"
                                [righeAutomatiche]="false"
                                [datiNuovi]="datiGrigliaGriglia2 && datiGrigliaGriglia2.DataTable"
                                [messaggioWarning]="messaggioWarningGriglia2"
                                [linkIcone]="Utils.linkIcone"

                                [paginazione]="'scrollable'"
                                [pageSize]="Utils.limitPerVirtual"
                                [DimensioneFont]='12'

                                (cellClick)="clickSelezioneGriglia2($event)"
                                (lastSelectedOfGrid)='lastSelectedOfGridGriglia2($event)'
                                (refresh)='refreshGridGriglia2($event, false)'
                                (editKeyPressed)="editPremuto($event)"
                                (resetLayout)='refreshGridGriglia2($event, true)'
                                (detectCambioPagina)="cambioPaginaGriglia2($event)"
                                (ritornoDimensioniColonne)="ritornoDimensioniColonneGrigliaGriglia2($event)"
                            >
                            </app-ants-grid-lib>

                            <div *ngIf="caricamentoDatiInCorsoGriglia2 == true" class="k-icon k-i-loading"
                                style="position: sticky; left: 0px; top: 0px; width: 100%; height: 100%; z-index: 2000;"
                            ></div>
                        </div>
                    </as-split-area>
                </as-split>
            </as-split-area>
        </as-split>
    </as-split-area>
</as-split>

<ng-container *ngIf="editDataVisible">
    <edit_dataset-component
        [sessioneID]="sessioneID"
        [userName]="userName"
        [Utils]="Utils"
        [dataSet]="datiModifica"
        [titoloMaschera]="'Edit SIM'"

        (chiudeMaschera)="editDataVisible = false"
    ></edit_dataset-component>
</ng-container>
