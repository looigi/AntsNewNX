<div ngdraggable class="finestrella">
  <h3 mat-dialog-title>GeoAnts</h3>
  <hr />
  <div mat-dialog-content>
    <p>{{ data.messaggio }}</p>
    <!-- <mat-form-field appearance="fill">
      <mat-label>Favorite Animal</mat-label>
      <input matInput [(ngModel)]="animal">
    </mat-form-field> -->
  </div>
  <hr />
  <div mat-dialog-actions style="text-align: center; display: block;">
    <button
      mat-raised-button
      color="primary"
      [mat-dialog-close]="'OK'"
      cdkFocusInitial
      [style.width.%]="data.mostraAnnulla ? '48' : '100'"
    >
      Ok
    </button>
    <button
      *ngIf="data.mostraAnnulla"
      color="warn"
      style="width: 48%;"
      mat-raised-button
      (click)="onNoClick()"
    >
      Cancel
    </button>
  </div>
</div>
