<!--
  [handle] = "handleBarraUPL" [bounds] = "divContenitoreA" [inBounds] = "true"
  (edge) = "checkEdge($event)" [inBounds] = "true"
-->
<div *ngIf="bUploadFile2" class="bloccaSfondo"></div>
<div *ngIf="bUploadFile2"
  [ngClass] = "{ 'top-b': !edge?.top, 'bottom-b': !edge?.bottom, 'left-b': !edge?.left, 'right-b': !edge?.right }"
  class="finestraUPL drag-block">
  <div class="barraSuperiore2" style="width: 100% !important; text-align: left;">
    <div #handleBarraUPL class="drag-block" style="width: calc(100% - 80px); float: left; padding-left: 5px;">
      Upload Report File
    </div>
    <div style="width: 80px; float: left; text-align: right; margin-top: -3px;">
      <img *ngIf = "Utils.linkIcone" [src] = "Utils.linkIcone + '/icons/close.png'" class="immaginiIcone" style="width: 33px; height: 33px;" title="Close" (click) = "chiudeUpload()">
    </div>
  </div>
  <br />

  <div style="width: 100%; padding: 3px; margin-top: 10px;">
    <!-- <input type="file" class="file-input" accept=".pbix, .xlsb" (change) = "onSelectFile($event)" #fileUpload /> -->
    <label class="custom-file-upload">
      <input type="file" accept=".json" (change) = "onSelectFile($event)" #fileUpload />
      <!-- <img *ngIf = "Utils.linkIcone" [src] = "Utils.linkIcone + '/icons/resetPosition.png'" class="immaginiIcone" title="Upload file"> -->
    </label>
    <span *ngIf = "nomeFile" style="float: left; margin-left: 10px; margin-top: 10px; width: calc(100% - 50px);">{{nomeFile}}</span>
    <span *ngIf = "!nomeFile" style="float: left; margin-left: 10px; margin-top: 10px; width: calc(100% - 50px);">Please select a file</span>
    <div style="clear: both;"></div>
    
    <div *ngIf = "file">
      <br />
      <section class="file-info">
        File details:
        <ul>
          <li><span style="font-weight: bold;">Name:</span></li>
          <li><input type="text" [(ngModel)] = "nomeFile2" style="width: 100%;" /></li>
          <li><span style="font-weight: bold;">Type:</span>
            <span *ngIf = "file.type">{{file.type}}</span>
            <span *ngIf = "!file.type">{{estensione}}</span>
          </li>
          <li><span style="font-weight: bold;">Size:</span>{{file.size}} bytes</li>
          <!-- <li style="font-weight: bold;">Folder:</li>
          <li><input type="text" [(ngModel)] = "folderFile" style="width: 100%;" /></li>
          <li><span style="font-weight: bold;">Description:</span></li>
          <li><input type="text" [(ngModel)] = "descriptionFile" style="width: 100%;" /></li> -->
          <li>
            <div style="width: 100%;">
              <div style="width: 50%; float: left;">
                <span style="font-weight: bold;">Validity Start Date:</span>
              </div>
              <div style="width: 50%; float: left;">
                <app-calendario
                  [Utils] = "Utils"
                  [dataPassata] = "validtyStartDate"
                  [dimensioneFont] = "10"
                  [allineatoADestra] = "true"
                  [tooltip] = "'GeoAnts keeps track of the cell history changes and processes activities according to the cell configuration valid in that moment. The date must be today or in the past. The Date cannot be previous of a date already loaded for the same Territory. You need to reprocess activities executed after this Validity Start Date to take into account the new cell configuration'"
                  [mostraIcona] = "true"
    
                  (dataSelezionata) = "impostaTimeVSD($event)"
                >
                </app-calendario>
              </div>
            </div>
          </li>
        </ul>
      </section>

      <button style="width: 100%;" (click) = "onUpload()">Upload the file</button>
    </div>
  </div>
</div>
