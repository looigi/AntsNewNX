<div #divContenitore style="width: 100%;"></div>

<app-barra-superiore
  [platformName]="platformName"
  [Utils]="Utils"
  [debug]="modalitaDebug"
  [sessioneID]="sessionId"
  [gruppo]="groupName"
  [microfonoAttivo]="microfonoAttivo"
  [userName]="userName"
  [groupName]="groupName"
  [fullScreen]="fullScreen"
  [urlRoot]="Utils.urlRoot"
  [nomeApp]="'Home'"

  [menuAperto]="menuVisibile"
  (apreMenuEmit)="apreMenu()"
  (statoServerEmit)="statoServer = $event"
  (statoManutenzioneEmit)="statoManutenzione = $event"
  (coloreSfondoEmit)="coloreStatoServer = $event"

>
</app-barra-superiore>

<div style="width: 100%; height: 40vh; float: left; margin-top: 15px; text-align: center; margin-left: 3%;">
  <div *ngIf='Utils.visibilita.hideMaps=="false" && showButtons' class="bottone" [style.width.%]="dimensioneBottone" (click)="changePage('Mappe;Mappe')">

      Dashboard
    </span>
  </div>
  <div *ngIf='Utils.visibilita.hideFleetManager=="false" && showButtons' class="bottone" [style.width.%]="dimensioneBottone" (click)="changePage('FM;TC')">

    [style.background-image]="tastoImmagine('/icons/fleet_tasto.png')" ></div>

      {{NomeFleetManager}}

      System
    </span>

    <span *ngIf="schermoStretto == false" class="testoImmagini">

<div
  [style.opacity]="menuVisibile ? 1 : 0"
  [style.width] = "dimeDrawer"
  [style.left]="menuVisibile ? '0px' : '-500px'"
  (mouseover)="over1()"
  (mouseleave)="leave1()"
  style="position: absolute; border-right: 1px solid #999; display: flex; top: 35px; height: 100%;
          background-color: #f4f4f4; z-index: 5000;">
  <div [style.width.px]="dimeDrawer" style="float: left; overflow: auto;
    -webkit-box-shadow: 3px 3px 10px 0px rgba(148,145,148,0.75);
    -moz-box-shadow: 3px 3px 10px 0px rgba(148,145,148,0.75);
    box-shadow: 3px 3px 10px 0px rgba(148,145,148,0.75);
    padding-bottom: 50px;
    ">

    <app-menu
      [debug]="modalitaDebug"
      [MenuVisibile]="menuVisibile"
      [showButtons]="true"
      [Altezza]="35"
      [posizione]="'absolute'"
      [sessionID]="sessionId"
      [voceSelezionata]="'Home'"
      [chiudiTutteVoci]="vociChiuseMenu"
      [statoServer]="statoServer"
      [statoManutenzione]="statoManutenzione"
      [coloreStatoServer]="coloreStatoServer"
      [comandoVocale]="comandoVocale"
      [platFormName]="platformName"

      (platFormNameEmit)="prendePlatFormName($event)"
      (dataAttualeEmit)="prendeDateNowH($event)"
      (symbTsEmit)="prendeSymb_TimeStamp($event)"
      (premutoEmit)="premutoVoceMenu($event)"
      (chiusuraEmit)="chiudeDrawer($event)"
      (lettoConfigJSON)="lettoJSON($event)"
      (userManualEmit)="fDownloadUserManual($event)"
    >    
    </app-menu>
    <!-- 
      (userManualEmit) = "fDownloadUserManual($event)" 
    -->
  </div>
</div>
