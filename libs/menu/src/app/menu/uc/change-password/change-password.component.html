<ng-template #template>
  <div class="modal-header">
    <h4 class="modal-title">Change Password</h4>
    <!-- <button type="button" class="close" aria-label="Close" (click)="close()">
      <span aria-hidden="true">&times;</span>
    </button> -->
  </div>
  <form [formGroup]="changePswForm" #f="ngForm" (ngSubmit)="onSubmit(f)">
    <div style="width: 100%;">
      <div style="width: 70%; float: left;">
        <div class="modal-body">

          <div class="form-group">
            <label class="center-block">Old Password:
              <input class="form-control" type="password" formControlName="oldPassword">
            </label>
          </div>

          <div class="form-group">
            <label class="center-block">New Password:
              <input class="form-control" type="password" formControlName="newPassword1">
            </label>
          </div>

          <div class="form-group">
            <label class="center-block">Repeat New Password:
              <input class="form-control" type="password" formControlName="newPassword2">
            </label>
          </div>

          <div class="form-group">
            <span style="color: red;">{{messageLog}}</span>
          </div>
        </div>
      </div>

      <div style="width: 30%; float: left; height: 150px; text-align: center; padding: 5px;">
        <img style="width: 140px; height: 140px;" [src]="PathIcone + '/icons/change psw.png'" />
      </div>
    </div>
    <div style="clear: both;"></div>
    <div class="modal-footer">
      <button class="btn btn-outline-dark" class="btn btn-outline-dark">Ok</button>
      <button type="button" class="btn btn-outline-dark" (click)="close()">Cancel</button>
    </div>
  </form>
</ng-template>
