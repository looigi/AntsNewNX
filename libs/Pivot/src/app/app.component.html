<div style="position: absolute; width: 75%; height: 75%; left: 15%; top: 15%; border: 1px solid #999;">
    <as-split direction="horizontal" (dragEnd) = "dragEndOrizzontale($event)">
        <as-split-area [size]="80">
            <div style="width: 100%; height: 100%; overflow: auto; text-align: left;">
                <pivot-component
                    [debug]="true"
                    [numeroFrame]="1"
                    [frameAttivo]="frameAttivo"
                    [sessioneID]="sessioneID"
                    [actSet]="actSet"
                    [tmsMin]="tmsMin"
                    [tmsMax]="tmsMax"
                    [tmsRangeMin]="tmsGlobalMin"
                    [tmsRangeMax]="tmsGlobalMax"
                    [fieldList]="fieldList"
                    [impostazioniPivot]="dati"
                    [Utilities]="Utilities"
                    [Titolo]="Titolo"
                    [cambioDimensioneContenitore]="cambioDimensioneContenitore"
                    [virtualizationAttiva]="false"
                    [refreshDati]="refreshDati"
                    [expandAll]="expandAll"
                    [tipoDisplay]="tipoDisplay"

                    (ritornoSettings)="ritornoSettings($event)"
                    (clickCellaEmit)="clickataCella($event)"
                >
                </pivot-component>
            </div>
        </as-split-area>
        <as-split-area [size]="20">
            <div style="width: 100%; height: 100%; overflow: auto; text-align: left;">
                <button (click)="refresha(true)">Refresh</button><br />
                <button (click)="expandAll = !expandAll">Espandi tutto</button><br />
                <button (click)="frameAttivo = 2; refresha(false)">Cambia Frame Attivo</button><br />
                <button (click)="cambiaTipoDisplay()">Chart</button>
            </div>
        </as-split-area>
    </as-split>
</div>
