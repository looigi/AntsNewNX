<div
    id="frameMappa_{{quale}}"
    class="tuttaAreaMappa img-magnifier-container" (click)="getCoordClick($event)"
    style="width: 100%; height: 100%;"
    [style.border]="debug2 ? '1px solid red' : '0px'"
    (mouseenter) ="entraMappa()" (mouseleave) ="esceMappa()">
</div>

<div *ngIf="caricamentoMappaInCorso == true" style="position: absolute; left: 1px; bottom: 1px; width: 50px; height: 50px; z-index: 1000;">
    <img *ngIf="Utils.linkIcone" [src]="Utils.linkIcone + '/spinner.gif'" style="width: 100%; height: 100%;">
</div>
