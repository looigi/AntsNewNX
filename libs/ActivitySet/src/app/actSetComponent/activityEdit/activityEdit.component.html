<div class="bloccaSfondo" style="z-index: 5010;"></div>

<div #myBounds class="drag-boundary" style="position: absolute; left: 1px; top: 1px; width: 100%; height: 100%;"
  [ngClass]="{ 'top-b': !edge?.top, 'bottom-b': !edge?.bottom, 'left-b': !edge?.left, 'right-b': !edge?.right }"
>
  <div ngDraggable ngResizable [handle]="handleInfo" class="mascheraPrincipale drag-block"
    (edge)="checkEdge($event)" [bounds]="myBounds" [inBounds]="true">
    <div kendoTooltip class="drag-block-handle barraSuperiore" style="position: absolute; text-align: left; white-space: nowrap; height: 28px;">
      <div #handleInfo style="text-align: center; width: 87%; float: left; margin-top: 2px;">Activity Edit</div>

      <div style="width: 12%; float: right; text-align: right;">
        <img [src]="Utils.linkIcone + '/icons/close_context.png'" (click)="mostraNascondeMenu()" title="Close"
          class="immaginiChiusura" style="width: 25px; float: right; cursor: pointer;">
        <img kendoTooltip [src]="Utils.linkIcone + '/icons/check-circle_white.png'" class="immaginiChiusura"
          style="width: 25px; height: 25px; float: right; margin-top: 1px; cursor: pointer;" title="Save" (click)="salvaDati()">
      </div>
    </div>

    <div style="margin-top: 30px; padding: 5px;">
        <div class="titolo" style="margin-top: 13px !important;">
          <span class="testo scuro">Activity Set Name:</span>
        </div>
        <div class="contenuto">
          <input
            #inputNome
            autofocus
            class="casellaTesto"
            style="text-align: left; width: 100%;"
            type = "text"
            [(ngModel)]="Name"
            value="{{Name}}" />
        </div>
        <div style="clear: both;"></div>

        <div class="titolo">
          <span class="testo scuro">Description: </span>
        </div>
        <div class="contenuto">
          <textarea
            style="width: 100%; color: #656565;"
            [(ngModel)]="Description"
            value="{{Description}}" >
          </textarea>
        </div>
        <div style="clear: both;"></div>

        <div class="titolo" style="margin-top: 14px !important;">
          <span class="testo scuro">User Group: </span>
        </div>
        <div class="contenuto">
          <app-combo-component
            [Debug]="Debug"
            [Tipologia]="'Combo'"
            [data] = "userGroupDati"
            [userName]="userName"
            [NomeCombo]="'UserGroup'"
            [campoId]="'GROUP_ID'"
            [campoTesto]="'NAME'"
            [valoreDefault]="UserGroup"
            [accettaNuovi]="false"
            [ricordaUltimoValore]="false"
            [pulisceFiltro]="pulisceFiltroUG"

            (selezioneEffettuata)="selectUserGroup($event)"
          >
          </app-combo-component>
        </div>
        <div style="clear: both;"></div>

        <div class="titolo" style="margin-top: 14px !important;">
          <span class="testo scuro">Folder: </span>
        </div>
        <div class="contenuto">
          <app-combo-component
            [Debug]="Debug"
            [Tipologia]="'Combo'"
            [data] = "activityGroup2"
            [userName]="userName"
            [NomeCombo]="'ActFolder'"
            [campoId]="'VALUE_STR'"
            [campoTesto]="'VALUE_STR'"
            [campoFiltro]="'VALUE_STR'"
            [valoreDefault]="Folder"
            [accettaNuovi]="true"
            [ricordaUltimoValore]="false"
            [pulisceFiltro]="pulisceFiltroAct"

            (selezioneEffettuata)="selectFolder($event)"
          >
          </app-combo-component>
        </div>
        <div style="clear: both;"></div>
