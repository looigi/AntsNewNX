  <div style="width: 100%; height: 100%;">
    <div class="custom-tab-container">
      <!-- <button class="scroll-button left" (click)="scrollTabs('left')">‹</button> -->

      <div class="custom-tab-header-wrapper" #tabHeaderWrapper>
        <div class="custom-tab-header-scroll" #tabHeaderScroll>
          <div
            class="custom-tab-header"
            [class.active]="vecchioTab == 0"
            (click)="onTabChanged(0)"
            [title]="'TcRun Prm and Measr'"
          >
            TcRun Prm and Measr
          </div>
          <div
            class="custom-tab-header"
            [class.active]="vecchioTab == 1"
            (click)="onTabChanged(1)"
            [title]="'TcRun Files'"
          >
            TcRun Files
          </div>
        </div>
      </div>

      <!-- <button class="scroll-button right" (click)="scrollTabs('right')">›</button> -->
    </div>

    <!-- Tab content -->
    <div class="custom-tab-content">
      <ng-container *ngIf="vecchioTab == 0">
        <span *ngIf="datiTcRunFile === null" style="width: 100%; text-align: left;">
          No data to be displayed
        </span>

        <app-ants-grid-lib
          [sessioneAttuale]="sessionID2"
          [debug]="debug"
          [indirizzoServer]="indirizzoServer"
          [righePerPaginareAutomaticamente]="righePerPaginazioneAutomatica"
          [modalita]="'Griglia'"
          [title]="'Tc Run Info'"
          [data]="datiTcRunInfo"
          [userName]="userName2"
          [maskName]="nomeGrigliaTII2"
          [newKeyVisibile]='false'
          [editKeyVisibile]='false'
          [deleteKeyVisibile]='false'
          [infoKeyVisibile]='true'
          [confirmKeyVisibile]="false"
          [selezioneMultipla]='false'
          [ricordaSelezione]='false'
          [impostaSelezione]='selezionatoTII2'
          [DimensioneFont]='12'
          [datiNuovi]="datiTcRunInfo && datiTcRunInfo.DataTable"
          [messaggioWarning]="messaggioWarningTcRunInfo"
          [paginazione]="'scrollable'"
          [AutoResize]="false"
          [ManualResize]="effettuaAutoFitInfo"
          [linkIcone]="Utils.linkIcone"
          [raggruppabile]="true"
          [campiPerRaggruppamento]="'SECTION_NAME'"
          (ritornoDimensioniColonne)="ritornoDimensioniColonneTcRun1($event)"

          (emitAITutte)="ritornoTastoAiTutte($event)"

          (cellClick)="clickRigaINFO($event)"
        >
        </app-ants-grid-lib>

        <div *ngIf="caricamentoTcRunInCorso1 == true" class="k-i-loading" style="position: relative; width: 100%; height: 110%;"></div>
      </ng-container>
      <ng-container *ngIf="vecchioTab == 1">
        <span *ngIf="datiTcRunFile === null" style="width: 100%; text-align: left;">
          No data to be displayed
        </span>

        <app-ants-grid-lib
          [debug]="debug"
          [sessioneAttuale]="sessionID2"
          [indirizzoServer]="indirizzoServer"
          [righePerPaginareAutomaticamente]="righePerPaginazioneAutomatica"
          [modalita]="'Griglia'"
          [title]="'Tc Run Files'"
          [data]="datiTcRunFile"
          [userName]="userName2"
          [maskName]="nomeGrigliaTIF2"
          [newKeyVisibile]='false'
          [editKeyVisibile]='false'
          [deleteKeyVisibile]='false'
          [infoKeyVisibile]='true'
          [confirmKeyVisibile]="false"
          [selezioneMultipla]='false'
          [ricordaSelezione]='false'
          [impostaSelezione]='selezionatoTIF2'
          [datiNuovi]="datiTcRunFile && datiTcRunFile.DataTable"
          [messaggioWarning]="messaggioWarningTcRunFile"
          [DimensioneFont]='12'
          [paginazione]="'scrollable'"
          [righePerPaginaVirtuale]="999"
          [AutoResize]="false"
          [ManualResize]="effettuaAutoFitFile"
          [linkIcone]="Utils.linkIcone"
          (ritornoDimensioniColonne)="ritornoDimensioniColonneTcRun2($event)"

          (cellClick)="clickRigaTI($event)"
        >
        </app-ants-grid-lib>

        <div *ngIf="mostraPopup" class="oscuraTcRun">
          <div *ngIf="mostraPopup" class="popupTcRun">
            Please wait...<br />Downloading
          </div>
        </div>

        <div *ngIf="caricamentoTcRunInCorso2 == true && !modalitaRealTimeAttiva" class="k-i-loading"></div>
        <div *ngIf="caricamentoTcRunInCorso2 == true && modalitaRealTimeAttiva" class="k-i-loadingRT">
          <img *ngIf="Utils.linkIcone" [src]="Utils.linkIcone + '/spinner.gif'" style="width: 100%; height: 100%;">
        </div>
      </ng-container>
    </div>
  </div>
